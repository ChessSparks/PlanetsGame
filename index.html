<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Planets Game — Level 1: Earth</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="title-screen">
    <button id="title-menu-btn" type="button" aria-label="Level select">☰</button>
    <div id="title-level-menu" class="hidden">
      <div id="title-level-menu-header">Jump to a level</div>
      <div id="title-level-list"></div>
      <button id="title-level-menu-close" type="button">Close</button>
    </div>
    <div id="title-content">
      <div id="title-name">Planets Game</div>
      <div id="title-tagline">A crash. A signal. A choice.</div>
      <div id="title-buttons">
        <button id="title-start-btn" type="button">Start</button>
      </div>
      <div id="title-note">Small game for your small brain!</div>
    </div>
  </div>

  <div id="loading-screen" class="hidden">
    <div id="loading-content">
      <div id="loading-title">Planets Game</div>
      <div id="loading-spinner"></div>
      <div id="loading-text">Loading assets…</div>
      <div id="loading-bar-track"><div id="loading-bar-fill"></div></div>
    </div>
  </div>

  <div id="hud">
    <div class="bar-group">
      <div class="bar-label">FUEL</div>
      <div class="bar-track"><div id="fuel-fill" class="bar-fill fuel"></div></div>
    </div>
    <div class="bar-group">
      <div class="bar-label">ALTITUDE</div>
      <div class="bar-track"><div id="altitude-fill" class="bar-fill altitude"></div></div>
    </div>
    <div id="cells-counter">Fuel Cells: <span id="cells-count">0</span> / <span id="cells-total">0</span></div>
  </div>

  <div id="message-overlay" class="hidden">
    <div id="message-box">
      <h1 id="message-title"></h1>
      <p id="message-body"></p>
      <button id="message-button">Start</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
